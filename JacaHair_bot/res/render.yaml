services:
  - type: web
    name: jacahairbeard-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m src.app"
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
    healthCheckPath: "/confirmar?id=1"
    autoDeploy: true
    region: oregon
